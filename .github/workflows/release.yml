name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: build wheel and sdist
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      # SDL3 comes from the vcpkg port, so the version follows vcpkg master rather
      # than the 3.4.20 that was verified locally.
      - name: cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            vcpkg/downloads
            vcpkg/packages
            vcpkg/installed
          key: vcpkg-sdl3-x64-windows

      - name: install sdl3
        shell: pwsh
        run: |
          if (-not (Test-Path vcpkg/scripts/buildsystems/vcpkg.cmake)) {
            git clone --depth 1 https://github.com/microsoft/vcpkg.git vcpkg
          }
          ./vcpkg/bootstrap-vcpkg.bat -disableMetrics
          ./vcpkg/vcpkg.exe install sdl3:x64-windows

      - name: build the native libraries
        shell: cmd
        run: scripts\build.cmd

      - name: check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Select-String -Path python/soshi/version.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "tag ${{ github.ref_name }} does not match python/soshi/version.py ($version)"
          }

      - name: install build tools
        run: python -m pip install --upgrade setuptools twine

      - name: build and check the artifacts
        shell: cmd
        env:
          PY: python
        run: scripts\release.cmd

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/soshi/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
