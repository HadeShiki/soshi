name: release

on:
  push:
    tags: ["v*"]
  # Manual runs build the artifacts without publishing, which is the dry run.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: build wheel and sdist
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      # SDL3 comes from the vcpkg port, so the version follows vcpkg master rather
      # than the 3.4.20 that was verified locally.
      - name: cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            vcpkg/downloads
            vcpkg/packages
            vcpkg/installed
          key: vcpkg-sdl3-x64-windows
          restore-keys: vcpkg-sdl3-x64-windows

      - name: install sdl3
        shell: pwsh
        run: |
          if (-not (Test-Path vcpkg/scripts/buildsystems/vcpkg.cmake)) {
            git clone --depth 1 https://github.com/microsoft/vcpkg.git vcpkg
          }
          ./vcpkg/bootstrap-vcpkg.bat -disableMetrics
          ./vcpkg/vcpkg.exe install sdl3:x64-windows

      - name: build the native libraries
        shell: cmd
        run: scripts\build.cmd

      - name: check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: python scripts/check_version.py ${{ github.ref_name }}

      - name: install build tools
        run: python -m pip install --upgrade setuptools twine

      - name: build and check the artifacts
        shell: cmd
        env:
          PY: python
        run: scripts\release.cmd

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/soshi/
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install twine
        run: python -m pip install --upgrade twine

      # A missing secret would otherwise fail inside twine with a confusing message.
      - name: check the token secret is set
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$PYPI_API_TOKEN" ]; then
            echo "::error::Add the PYPI_API_TOKEN secret: Settings > Secrets and variables > Actions."
            exit 1
          fi

      # --skip-existing keeps a retry after a partial upload working; a completely
      # new version still goes up, and PyPI itself refuses to replace a file.
      - name: upload to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m twine check dist/*
          python -m twine upload --non-interactive --skip-existing dist/*
